<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduFire — Unterrichtsplanung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F4F1; --card:#FFFFFF; --sunk:#FAFAF8;
  --ink:#14161A; --ink-2:#494E57; --ink-3:#878C95;
  --line:#E7E6E0; --line-2:#D2D1C9;
  --magenta:#E4006C; --magenta-2:#B8005A; --yellow:#FFD500;
  --ok:#0D9660; --warn:#C1392B; --amber:#A97800;
  --c1:#E4006C; --c2:#F27405; --c3:#0E8A78; --c4:#3B4CCA;
  --r-lg:16px; --r:11px; --r-s:8px;
  --pad:clamp(14px,3.4vw,22px);
  --sh-1:0 1px 2px rgba(20,22,26,.04);
  --sh-2:0 2px 6px rgba(20,22,26,.05), 0 10px 26px rgba(20,22,26,.05);
  --sh-3:0 14px 46px rgba(20,22,26,.22);
  --tap:40px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-wrap:break-word}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--ink);max-width:100%}
@media (max-width:820px){input,select,textarea{font-size:16px}}
:focus-visible{outline:2px solid var(--magenta);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ═══ Topbar ═══ */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line)}
.topbar::after{content:'';display:block;height:2px;background:linear-gradient(90deg,var(--yellow),var(--magenta) 55%,#3B4CCA)}
.topbar-in{max-width:1280px;margin:0 auto;padding:10px var(--pad);display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.flame{width:24px;height:30px;flex:none}
.wordmark{font-family:Anton,sans-serif;font-size:20px;line-height:1;letter-spacing:.01em}
.wordmark .fire{color:var(--magenta)}
.tagline{font-size:10px;color:var(--ink-3);margin-top:3px;white-space:nowrap}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:3px;gap:2px;flex:none}
.seg button{padding:7px 14px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;min-height:32px}
.seg button[aria-selected="true"]{background:var(--ink);color:#fff}
.wknav{display:flex;align-items:center;gap:2px;background:var(--bg);border:1px solid var(--line);
  border-radius:var(--r);padding:3px;position:relative;flex:none}
.wknav .nav{width:32px;height:32px;border-radius:8px;font-size:16px;color:var(--ink-2);display:flex;align-items:center;justify-content:center}
.wknav .nav:hover{background:var(--card);color:var(--ink)}
.wkdate{padding:2px 8px;text-align:center;min-width:118px}
.wkdate b{display:block;font-size:13px;font-weight:700;line-height:1.2}
.wkdate span{display:block;font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--ink-3)}
.wknav .today{padding:0 12px;height:32px;border-radius:8px;background:var(--magenta);color:#fff;font-size:11.5px;font-weight:700}
.wknav .today:hover{background:var(--magenta-2)}
.wknav .today:disabled{opacity:.32;cursor:default}
.datepop{position:absolute;top:calc(100% + 8px);right:0;background:var(--card);border:1px solid var(--line-2);
  border-radius:var(--r);padding:10px;box-shadow:var(--sh-3);z-index:60}
.datepop input{border:1px solid var(--line-2);border-radius:8px;padding:8px 10px}
.iconbtn{width:36px;height:36px;border-radius:var(--r);border:1px solid var(--line);display:flex;
  align-items:center;justify-content:center;color:var(--ink-2);background:var(--bg);flex:none;font-size:15px;position:relative}
.iconbtn[data-cloud]::after{content:'';position:absolute;top:-2px;right:-2px;width:10px;height:10px;
  border-radius:50%;border:2px solid var(--card);background:var(--ink-3)}
.iconbtn[data-cloud="off"]::after{display:none}
.iconbtn[data-cloud="signed-in"]::after{background:var(--ok)}
.iconbtn[data-cloud="signed-out"]::after{background:var(--amber)}
.iconbtn[data-cloud="connecting"]::after{background:var(--amber)}
.iconbtn[data-cloud="error"]::after{background:var(--warn)}
.clouddot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ink-3);margin-right:2px}
.clouddot[data-s="signed-in"]{background:var(--ok)}
.todo-count{position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;padding:0 4px;
  border-radius:9px;background:var(--magenta);color:#fff;font-size:9.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;line-height:1;border:2px solid var(--card)}
.clouddot[data-s="signed-out"],.clouddot[data-s="connecting"]{background:var(--amber)}
.clouddot[data-s="error"]{background:var(--warn)}
.iconbtn:hover{border-color:var(--line-2);color:var(--ink)}

/* Tablet / Phone: Topbar in zwei Zeilen */
@media (max-width:900px){
  .topbar-in{flex-wrap:wrap;row-gap:9px}
  .brand{order:1}
  .iconbtn{order:2}
  .seg{order:3;flex:1 1 auto}
  .seg button{flex:1;text-align:center}
  .wknav{order:4;flex:1 1 100%;justify-content:space-between}
  .wkdate{flex:1}
}
@media (max-width:400px){ .tagline{display:none} }

/* ═══ Layout ═══ */
.wrap{max-width:1280px;margin:0 auto;padding:var(--pad) var(--pad) 84px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.section-head h2{margin:0;font-size:clamp(16px,2.4vw,19px);font-weight:700;letter-spacing:-.02em}
.section-head p{margin:2px 0 0;font-size:12.5px;color:var(--ink-3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-2);
  background:var(--card);padding:9px 15px;border-radius:var(--r-s);font-size:12.5px;font-weight:600;
  min-height:38px;transition:border-color .12s,background .12s,transform .1s}
.btn:hover{border-color:var(--ink-3)}
.btn:active{transform:scale(.98)}
.btn-dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn-dark:hover{background:#000}
.btn-warn{color:var(--warn);border-color:#EBC7C3}
.btn-warn:hover{background:#FCEEEC}
.btn-s{padding:6px 11px;font-size:11.5px;min-height:32px}

/* ═══ Wochenboard ═══ */
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:clamp(12px,2vw,18px);align-items:start}
@media (max-width:700px){.board{grid-template-columns:1fr}}
.daycard{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh-2)}
.dayhead{padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line)}
.dayhead .name{font-size:15px;font-weight:700;letter-spacing:-.01em}
.dayhead .date{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-3);margin-top:1px}
.daycard.is-today{border-color:var(--ink)}
.daycard.is-today .dayhead{background:var(--ink);border-bottom-color:var(--ink)}
.daycard.is-today .name{color:#fff}
.daycard.is-today .date{color:rgba(255,255,255,.62)}
.pill-today{background:var(--yellow);color:var(--ink);font-size:9.5px;font-weight:700;letter-spacing:.05em;padding:3px 9px;border-radius:20px;flex:none}
.daybody{padding:11px;display:flex;flex-direction:column;gap:9px}
.lesson{--c:#999;position:relative;width:100%;text-align:left;background:var(--sunk);border:1px solid var(--line);
  border-radius:var(--r);padding:12px 13px 11px 16px;transition:border-color .14s,box-shadow .14s,transform .14s}
.lesson::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.lesson:hover{border-color:var(--line-2);background:var(--card);box-shadow:var(--sh-2);transform:translateY(-1px)}
.lesson .l1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lesson .cname{font-size:13px;font-weight:700;letter-spacing:-.01em}
.lesson .dur{flex:none;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-3);
  background:var(--card);border:1px solid var(--line);border-radius:20px;padding:2px 8px}
.lesson .topic{margin-top:5px;font-size:12.5px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lesson .topic.blank{color:var(--ink-3);font-style:italic}
.tl{display:flex;gap:2px;height:6px;margin-top:10px;border-radius:4px;overflow:hidden}
.tl span[data-on="false"]{opacity:.2}
.lesson .l3{margin-top:9px;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink-3);flex-wrap:wrap}
.prog{height:4px;width:46px;background:var(--line);border-radius:3px;overflow:hidden;flex:none}
.prog i{display:block;height:100%;background:var(--ok)}
.chip-comp{color:var(--magenta);font-weight:700}
.lesson-off{opacity:.68;background:repeating-linear-gradient(135deg,var(--sunk),var(--sunk) 8px,var(--card) 8px,var(--card) 16px)}
.lesson-off:hover{opacity:.9}
.offtag{font-size:12px;color:var(--ink-2);font-style:italic;padding-left:9px}

/* ═══ Kursübersicht ═══ */
.coursebar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.coursebar button{--c:#999;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);
  background:var(--card);padding:9px 15px;border-radius:22px;font-size:12.5px;font-weight:600;color:var(--ink-2);min-height:38px}
.coursebar button i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.coursebar button[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink);border-color:var(--ink)}
.ovtable{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh-2)}
.ovrow{display:grid;grid-template-columns:125px 1fr 215px;gap:16px;padding:14px 18px;border-bottom:1px solid var(--line);align-items:start;cursor:pointer;text-align:left;width:100%;background:none}
.ovrow:last-child{border-bottom:none}
.ovrow:hover{background:var(--sunk)}
@media (max-width:820px){.ovrow{grid-template-columns:1fr;gap:7px;padding:14px 16px}}
.ovdate{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--ink-2)}
.ovdate b{display:block;font-family:Inter;font-size:12px;color:var(--ink)}
@media (max-width:820px){.ovdate{display:flex;gap:8px;align-items:baseline}.ovdate b{display:inline}}
.ovtopic{font-size:13.5px;font-weight:600}
.ovgoal{font-size:12px;color:var(--ink-3);margin-top:2px}
.ovmeta{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:10.5px;padding:2px 9px;border-radius:20px;background:var(--sunk);color:var(--ink-2);border:1px solid var(--line)}
.tag.comp{border-color:#F2C3D9;background:#FDF0F6;color:var(--magenta-2)}
.tag.off{border-color:var(--line-2);background:var(--sunk);color:var(--ink-2)}
.ovrow-off{opacity:.72}
.ovrow-off .ovtopic{font-style:italic;color:var(--ink-2)}
.empty{padding:52px 22px;text-align:center;color:var(--ink-3)}
.empty h3{margin:0 0 6px;font-size:15px;color:var(--ink-2)}
.empty p{margin:0;font-size:13px}

/* ═══ Dialoge ═══ */
.scrim{position:fixed;inset:0;background:rgba(16,18,22,.52);z-index:100;display:flex;align-items:flex-start;
  justify-content:center;padding:24px 16px;overflow-y:auto;overscroll-behavior:contain}
.dialog{background:var(--card);border-radius:var(--r-lg);width:100%;max-width:900px;box-shadow:var(--sh-3);overflow:hidden}
.dialog.narrow{max-width:440px}
.dhead{position:sticky;top:0;z-index:3;background:var(--card);border-bottom:1px solid var(--line);
  padding:16px var(--pad);display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.dhead .eyebrow{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink-3);font-family:'JetBrains Mono',monospace;flex-wrap:wrap}
.dhead h2{margin:5px 0 0;font-size:clamp(16px,2.6vw,19px);font-weight:700;letter-spacing:-.02em}
.xclose{width:36px;height:36px;border-radius:10px;font-size:17px;color:var(--ink-3);flex:none;display:flex;align-items:center;justify-content:center}
.xclose:hover{background:var(--sunk);color:var(--ink)}
.dbody{padding:18px var(--pad)}
.dfoot{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding:12px var(--pad);display:flex;justify-content:space-between;gap:9px;flex-wrap:wrap}
.dfoot .grp{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:700px){
  .scrim{padding:0;align-items:stretch;overflow:hidden}
  .dialog{border-radius:0;max-width:none;height:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
  .dhead{flex:0 0 auto}
  .dbody{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .dfoot{flex:0 0 auto;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
  .dfoot .grp{flex:1}
  .dfoot .btn{flex:1}
}
.lbl{display:block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:7px}
.fld{width:100%;border:1px solid var(--line-2);border-radius:var(--r-s);padding:10px 12px;font-size:13.5px;background:var(--card)}
.fld:focus{border-color:var(--ink);outline:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-bottom:18px}
@media (max-width:700px){.two{grid-template-columns:1fr;gap:12px}}

/* Phasen-Editor */
.phasebar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:10px 12px;background:var(--sunk);
  border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px}
.phasebar select{border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;font-size:12px;background:var(--card);max-width:100%;flex:1 1 190px;min-width:0}
.budget{margin-left:auto;display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:700;flex-wrap:wrap}
.budget .num{font-family:'JetBrains Mono',monospace;font-size:14.5px}
.budget[data-state="ok"]{color:var(--ok)} .budget[data-state="under"]{color:var(--amber)} .budget[data-state="over"]{color:var(--warn)}
.budget .sub{font-weight:500;color:var(--ink-3);font-size:11.5px}
@media (max-width:700px){.budget{margin-left:0;flex:1 1 100%;justify-content:space-between;border-top:1px dashed var(--line-2);padding-top:9px}}

.phaserow{--c:#999;border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;overflow:hidden;background:var(--card)}
.phaserow[data-filled="true"]{border-color:var(--line-2);box-shadow:var(--sh-1)}
.phead{display:flex;align-items:center;gap:7px;padding:8px 10px;background:var(--sunk);border-bottom:1px solid var(--line);flex-wrap:wrap}
.phead .swatch{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.phead select.psel{border:1px solid transparent;background:transparent;font-size:12px;font-weight:700;
  color:var(--c);border-radius:7px;padding:5px 6px;max-width:160px;min-height:32px}
.phead select.psel:hover{border-color:var(--line-2);background:var(--card)}
.phead input.plabel{flex:1 1 120px;min-width:0;border:1px solid transparent;background:transparent;
  font-size:12.5px;font-weight:600;padding:6px 7px;border-radius:7px;min-height:32px}
.phead input.plabel:hover,.phead input.plabel:focus{border-color:var(--line-2);background:var(--card);outline:none}
.fixed-badge{--c:#A16207;flex:1 1 120px;min-width:0;display:flex;align-items:center;gap:6px;
  font-size:12.5px;font-weight:700;color:var(--c);padding:6px 7px;min-height:32px}
.fixed-badge::before{content:"🔒";font-size:10px;flex:none}
.minwrap{display:inline-flex;align-items:center;gap:3px;background:var(--card);border:1px solid var(--line-2);
  border-radius:20px;padding:2px 4px 2px 10px;flex:none}
.minwrap input{width:38px;border:none;background:transparent;font-family:'JetBrains Mono',monospace;
  font-size:12.5px;font-weight:600;text-align:right;padding:4px 0}
.minwrap input:focus{outline:none}
.minwrap span{font-size:11px;color:var(--ink-3);padding-right:5px}
.rowtools{display:flex;gap:2px;flex:none;margin-left:auto}
.rowtools button{width:32px;height:32px;border-radius:8px;color:var(--ink-3);font-size:12px;display:flex;align-items:center;justify-content:center}
.rowtools button:hover{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.rowtools button.del:hover{color:var(--warn)}
.rowtools button:disabled{opacity:.28}
@media (max-width:480px){
  .phead{display:grid;grid-template-columns:20px 1fr auto;
    grid-template-areas:"sw sel tools" "sw lbl lbl" "sw min min";
    column-gap:8px;row-gap:6px;padding:9px 10px}
  .phead .swatch{grid-area:sw;align-self:start;margin-top:7px}
  .phead select.psel{grid-area:sel;max-width:none;width:100%;min-width:0}
  .phead input.plabel{grid-area:lbl;width:100%}
  .fixed-badge{grid-area:sel}
  .phead .minwrap{grid-area:min;justify-self:start}
  .phead .rowtools{grid-area:tools;justify-self:end;margin-left:0}
  .pgrid{padding:9px 10px;gap:7px}
  .pgrid input{padding:9px 10px}
  .tlbar{height:24px}
}
.pgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:10px 12px}
@media (max-width:820px){.pgrid{grid-template-columns:1fr}}
.pgrid input{border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:12.5px;background:var(--sunk);min-width:0}
.pgrid input:focus{border-color:var(--ink);background:var(--card);outline:none}
.colhint{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:0 12px;font-size:9.5px;font-weight:700;
  letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);margin-bottom:7px}
@media (max-width:820px){.colhint{display:none}}
.addrow{display:flex;gap:8px;margin:2px 0 18px}

.timeline{margin:6px 0 20px}
.tlbar{display:flex;height:28px;border-radius:9px;overflow:hidden;border:1px solid var(--line-2);
  background:repeating-linear-gradient(45deg,#F1F1EC,#F1F1EC 5px,#E9E9E3 5px,#E9E9E3 10px)}
.tlseg{display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;color:#fff;
  overflow:hidden;white-space:nowrap;border-right:1px solid rgba(255,255,255,.4)}
.tlticks{display:flex;justify-content:space-between;margin-top:5px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-3)}

.fbgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
@media (max-width:700px){.fbgrid{grid-template-columns:1fr}}
.fb{border-radius:var(--r);padding:12px 13px}
.fb.exit{background:#FDF1EF;border:1px solid #F2D2CD}
.fb.res{background:#ECF8F2;border:1px solid #C6E6D8}
.fb label{display:block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.fb.exit label{color:var(--warn)} .fb.res label{color:var(--ok)}
.fb textarea{width:100%;border:1px solid rgba(0,0,0,.08);border-radius:8px;padding:8px 10px;font-size:12.5px;
  background:rgba(255,255,255,.8);resize:vertical;min-height:48px}
.fb textarea:focus{outline:none;background:#fff}

/* Standard-Auswahl */
.compbox{border:1px solid var(--line);border-radius:var(--r);background:var(--sunk);padding:12px;margin-bottom:18px}
.cancelpanel{text-align:center;padding:10px 6px 4px}
.cancel-icon{font-size:34px;color:var(--ink-3);line-height:1;margin-bottom:10px}
.cancelpanel h3{margin:0 0 6px;font-size:16px}
.cancelpanel .hint{margin:0 0 18px}
.cancelpanel .lbl{text-align:left;margin-bottom:6px}
.cancelpanel .fld{text-align:left}
.compchips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:11px}
.compchip{display:inline-flex;align-items:flex-start;gap:8px;background:var(--card);border:1px solid var(--line-2);

<script>
"use strict";
/* ══ 1 · STORAGE — lokal, Claude-Vorschau oder Supabase (geräteübergreifend) ══ */
const NS="edufire:";
const localBackend={
  async get(k){const v=localStorage.getItem(NS+k);return v===null?null:{key:k,value:v};},
  async set(k,v){localStorage.setItem(NS+k,v);return{key:k,value:v};},
  async del(k){localStorage.removeItem(NS+k);return{key:k,deleted:true};},
  async list(p){const keys=[];for(let i=0;i<localStorage.length;i++){const raw=localStorage.key(i);
    if(raw&&raw.startsWith(NS)){const k=raw.slice(NS.length);if(!p||k.startsWith(p))keys.push(k);}}return{keys};},
  name:"localStorage"};
const hostBackend=(typeof window!=="undefined"&&window.storage&&typeof window.storage.get==="function")?{
  async get(k){try{return await window.storage.get(k,false);}catch(e){return null;}},
  async set(k,v){try{return await window.storage.set(k,v,false);}catch(e){return localBackend.set(k,v);}},
  async del(k){try{return await window.storage.delete(k,false);}catch(e){return localBackend.del(k);}},
  async list(p){try{return(await window.storage.list(p,false))||{keys:[]};}catch(e){return{keys:[]};}},
  name:"host"}:null;
const offlineBackend=hostBackend||localBackend;

/* Supabase-Backend: eine Zeile pro Schlüssel, RLS auf den angemeldeten Nutzer beschränkt */
function makeSupabaseBackend(client,userId){
  const table="edufire_kv";
  return{
    async get(k){
      const{data,error}=await client.from(table).select("value").eq("user_id",userId).eq("key",k).maybeSingle();
      if(error||!data)return null;
      return{key:k,value:data.value};
    },
    async set(k,v){
      const{error}=await client.from(table).upsert(
        {user_id:userId,key:k,value:v,updated_at:new Date().toISOString()},{onConflict:"user_id,key"});
      if(error)throw error;
      return{key:k,value:v};
    },
    async del(k){await client.from(table).delete().eq("user_id",userId).eq("key",k);return{key:k,deleted:true};},
    async list(p){
      let q=client.from(table).select("key").eq("user_id",userId);
      if(p)q=q.like("key",p+"%");
      const{data,error}=await q;
      if(error||!data)return{keys:[]};
      return{keys:data.map(r=>r.key)};
    },
    name:"supabase"};
}

let cloudBackend=null; // gesetzt nach erfolgreicher Supabase-Anmeldung
const DB={
  async get(k){if(cloudBackend){try{return await cloudBackend.get(k);}catch(e){}}return offlineBackend.get(k);},
  async set(k,v){if(cloudBackend){try{return await cloudBackend.set(k,v);}catch(e){}}return offlineBackend.set(k,v);},
  async del(k){if(cloudBackend){try{return await cloudBackend.del(k);}catch(e){}}return offlineBackend.del(k);},
  async list(p){if(cloudBackend){try{return await cloudBackend.list(p);}catch(e){}}return offlineBackend.list(p);},
  get backend(){return cloudBackend?"supabase":offlineBackend.name;}
};

function applyConfig(){
  const c=CONFIG;
  COURSES=(c.courses||[]).map((x,i)=>({...x,color:x.hex||PALETTE[i%PALETTE.length],hex:x.hex||PALETTE[i%PALETTE.length]}));

/* Unterrichtsfreie Woche? */
function weekIsHoliday(monday){
  const i=isoWeek(monday);
  const key=i.year+"-W"+String(i.week).padStart(2,"0");
  return (CONFIG.holidays||[]).includes(key);
}

/* Nächster realer Termin eines Kurses ab jetzt (überspringt bereits begonnene Stunden heute) */
function nextLessonFor(courseId){
  const slots=SLOTS.filter(s=>s.course===courseId);
  if(!slots.length)return null;
  const now=new Date();
  const nowMin=now.getHours()*60+now.getMinutes();
  for(let add=0;add<14;add++){
    const d=addDays(now,add);
    const todays=slots.filter(s=>s.day===d.getDay()).sort((a,b)=>(a.start||"").localeCompare(b.start||""));
    for(const s of todays){
      if(add===0&&s.start){
        const[h,m]=s.start.split(":").map(Number);
        if(h*60+m<nowMin)continue;
      }
      return{slot:s,date:d};
    }
  }
  return null;
}

che Informationen aus Materialien erschließen","Informationen aus Quellen und Darstellungen wiedergeben"],["E/F","Historische Informationen aus Materialien erschließen","den Informationsgehalt einer Quelle oder Darstellung nach vorgegebenen Kriterien untersuchen"],["E/F","Historische Informationen aus Materialien erschließen","Informationen aus Quellen und Darstellungen in eigenen Worten wiedergeben"],["G/H","Historische Informationen aus Materialien erschließen","Kernaussagen von Quellen und Darstellungen identifizieren und in eigenen Worten zusammenfassen"],["D","Herkunft von Informationen nachweisen","die Herkunft ihrer Informationen erläutern"],["E/F","Herkunft von Informationen nachweisen","Informationen mit Fundstellen/Zitaten belegen"],["E/F","Herkunft von Informationen nachweisen","die Bedeutung des Nachweisens von Fundstellen und Zitaten erörtern"],["G","Herkunft von Informationen nachweisen","Zitate formal korrekt kennzeichnen"],["G","Herkunft von Informationen nachweisen","Fundstellen aus Literatur und Internet formal korrekt wiedergeben"],["H","Herkunft von Informationen nachweisen","Zitate in indirekte Rede umformulieren"],["D","Recherchen durchführen","historische Informationen von Sachkundigen oder Zeitzeuginnen und Zeitzeugen ermitteln"],["D","Recherchen durchführen","Museen, Ausstellungen, das lokale/regionale Umfeld nutzen"],["E/F","Recherchen durchführen","Recherchen in der Bibliothek, im Internet, Museum, im lokalen/regionalen Umfeld planvoll durchführen"],["E/F","Recherchen durchführen","die Glaubwürdigkeit von Informationen aus analogen und digitalen Fundorten unter Anleitung kritisch reflektieren"],["G/H","Recherchen durchführen","ein Interview planen, durchführen, protokollieren und auswerten"],["G/H","Recherchen durchführen","das eigene Vorgehen begründen und kritisch reflektieren"],["D","Fachsprache anwenden","Fachbegriffe richtigen Erklärungen zuordnen"],["D","Fachsprache anwenden","Fachbegriffe in einem historischen Kontext anwenden"],["E/F","Fachsprache anwenden","die Bedeutung von Fachbegriffen erklären"],["E/F","Fachsprache anwenden","Fachbegriffe vernetzt darstellen (z. B. Begriffsnetze, Ober- und Unterbegriffe)"],["G/H","Fachsprache anwenden","die Bedeutung von Begriffen in der Alltags- und Fachsprache, in Vergangenheit und Gegenwart untersuchen und reflektieren"]]},{"c":"2.4","n":"Urteilen und sich orientieren","entries":[["D","Historische Werturteile und Wertmaßstäbe entwickeln, bewerten und anwenden","zwischen einem Vorausurteil und einem differenzierten Urteil unterscheiden"],["D","Historische Werturteile und Wertmaßstäbe entwickeln, bewerten und anwenden","eigene Argumente mithilfe von individuellen Wertmaßstäben (z. B. Recht, Gerechtigkeit) begründen"],["D","Historische Werturteile und Wertmaßstäbe entwickeln, bewerten und anwenden","fremde Standpunkte wahrnehmen und darstellen"],["D","Historische Werturteile und Wertmaßstäbe entwickeln, bewerten und anwenden","die Pluralität von Urteilen anerkennen und die eigene Position sachlich vertreten"],["E/F","Historische Werturteile und Wertmaßstäbe entwickeln, bewerten und anwenden","individuelle Wertmaßstäbe von denen anderer unterscheiden und sie mit historischen Wertmaßstäben vergleichen"],["E/F","Historische Werturteile und Wertmaßstäbe entwickeln, bewerten und anwenden","Werturteile auf der Grundlage der Menschenrechte beurteilen"],["G/H","Historische Werturteile und Wertmaßstäbe entwickeln, bewerten und anwenden","Gemeinsamkeiten und Unterschiede von historischen und gegenwärtigen Werten erörtern"],["G/H","Historische Werturteile und Wertmaßstäbe entwickeln, bewerten und anwenden","die Vielfalt gegenwärtiger Werturteile erörtern und in ihrer Unterschiedlichkeit würdigen"],["G/H","Historische Werturteile und Wertmaßstäbe entwickeln, bewerten und anwenden","begründen, welche Bedeutung die individuellen Werturteile für die eigene lebensweltliche Orientierung in der Gegenwart haben"]]},{"c":"2.5","n":"Darstellen – historisch erzählen","entries":[["D","Historische Sachverhalte zu einer Darstellung verbinden (Narrativität)","nachprüfbare Ereignisse/Sachverhalte sinnhaft auf- und erzählen"],["E/F","Historische Sachverhalte zu einer Darstellung verbinden (Narrativität)","ein Ereignis nachvollziehbar und erklärend darstellen"],["E/F","Historische Sachverhalte zu einer Darstellung verbinden (Narrativität)","Ursachen und Auswirkungen eines Ereignisses in der eigenen Darstellung nennen und begründen"],["G","Historische Sachverhalte zu einer Darstellung verbinden (Narrativität)","eine in sich schlüssige, an Fakten gebundene und mehrere Ursachen abwägende Darstellung formulieren"],["G","Historische Sachverhalte zu einer Darstellung verbinden (Narrativität)","Beginn und Abschluss ihrer Darstellung begründen"],["H","Historische Sachverhalte zu einer Darstellung verbinden (Narrativität)","zwischen Ursachen, Anlass sowie Auswirkungen in der Argumentation begründend unterscheiden"],["H","Historische Sachverhalte zu einer Darstellung verbinden (Narrativität)","eine rezensierende Stellungnahme zu einer historischen Darstellung formulieren"],["H","Historische Sachverhalte zu einer Darstellung verbinden (Narrativität)","abwägend argumentieren"]]}]},{"id":"dgo","name":"RLP gymnasiale Oberstufe Deutsch (Teil C)","subject":"Deutsch","gradeMin":11,"levels":["GK","LK"],"levelNote":"Abschlussorientierte Standards, Grundkurs","areas":[{"n":"Sprechen und Zuhören","standards":["in ihren Gesprächen auf Verständigung zielen und respektvolles Gesprächsverhalten zeigen","in verschiedenen Gesprächsformen und in unterschiedlichen Rollen kommunikativ handeln und dabei nonverbale sowie stimmliche Mittel bewusst nutzen","zur Analyse mündlicher Kommunikationssituationen exemplarisch auditive und audiovisuelle Aufzeichnungen sowie Mitschriften nutzen","den Verlauf fachlich anspruchsvoller monologischer und dialogischer Gesprächsformen konzentriert verfolgen, um Argumentation und Intention der Gesprächspartner wiederzugeben bzw. zusammenzufass /* ══ 5 · HELPER ══ */
function addDays(d,n){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x;}
function mondayOf(d){const w=d.getDay();return addDays(d,w===0?-6:1-w);}
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();}
function isoWeek(date){const d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));
  d.setUTCDate(d.getUTCDate()+4-(d.getUTCDay()||7));
  const y0=new Date(Date.UTC(d.getUTCFullYear(),0,1));
  return{year:d.getUTCFullYear(),week:Math.ceil(((d-y0)/86400000+1)/7)};}
function mondayFromISO(y,w){const j=new Date(y,0,4);return addDays(addDays(j,1-(j.getDay()||7)),(w-1)*7);}
function dShort(d){return d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"});}
function dLong(d){return d.toLocaleDateString("de-DE",{weekday:"long",day:"2-digit",month:"long",year:"numeric"});}
function parseHM(s){const[h,m]=s.split(":").map(Number);return h*60+m;}
function fmtHM(mins){mins=((mins%1440)+1440)%1440;const h=Math.floor(mins/60),m=mins%60;return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");}
/* Reale Uhrzeit einer Phase innerhalb der Stunde, sofern der Slot eine Startzeit hat */
function rowClock(slot,rows,idx){
  if(!slot.start)return null;
  const base=parseHM(slot.start);
  let offset=0;for(let i=0;i<idx;i++)offset+=(+rows[i].min||0);
  const start=base+offset,end=start+(+rows[idx].min||0);
  return fmtHM(start)+"–"+fmtHM(end);
}
function keyFor(m){const i=isoWeek(m);return "week:"+i.year+"-W"+String(i.week).padStart(2,"0");}
function toISO(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
let toastT;
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.setAttribute("data-on","true");
  clearTimeout(toastT);toastT=setTimeout(()=>t.setAttribute("data-on","false"),1500);}

/* Vorlage (Einheiten) → Zeilen in Minuten, Summe == Stundenlänge */
function templateToRows(tpl,min){
  const total=tpl.units.reduce((a,u)=>a+u[2],0)||1;
  let rows=tpl.units.map(u=>({phase:u[0],label:u[1],min:Math.max(1,Math.round(u[2]*min/total)),kern:"",impuls:"",sozial:""}));
  let diff=min-rows.reduce((a,r)=>a+r.min,0);
  while(diff!==0&&rows.length){
    let idx=0;
    for(let i=1;i<rows.length;i++) if(diff>0?rows[i].min>rows[idx].min:rows[i].min>rows[idx].min) idx=i;
    rows[idx].min+=diff>0?1:-1;
    diff+=diff>0?-1:1;
    if(rows[idx].min<1){rows[idx].min=1;break;}
  }
  return rows;
}
function allTemplates(){return BUILTIN_TEMPLATES.concat(S.templates);}
function templateById(id){return allTemplates().find(t=>t.id===id);}

function buildDefaultRows(tplId,min,slotId){
  const intro=slotId&&SLOT_INTRO[slotId];
  if(intro){
    const remaining=Math.max(1,min-intro.min);
    const rest=templateToRows(templateById(tplId),remaining);
    return [{phase:intro.phase,label:intro.label,min:intro.min,kern:"",impuls:"",sozial:""}].concat(rest);
  }
  return templateToRows(templateById(tplId),min);
}
function blankLesson(min,slotId){
  const tplId=DEFAULT_TEMPLATE_FOR(min);
  return {topic:"",goal:"",material:"",comps:[],tpl:tplId,
    rows:buildDefaultRows(tplId,min,slotId),exit:"",reserve:"",
    cancelled:false,reason:""};
}
function normalize(l,min,slotId){
  if(!l) return blankLesson(min,slotId);
  l.topic=l.topic||"";l.goal=l.goal||"";l.material=l.material||"";l.exit=l.exit||"";l.reserve=l.reserve||"";
  l.tpl=l.tpl||"";l.cancelled=!!l.cancelled;l.reason=l.reason||"";
  if(!Array.isArray(l.comps)) l.comps=[];
  l.comps=l.comps.map(c=>typeof c==="string"?{id:uid("k"),src:"Eigen",text:c}:c).filter(Boolean);
  if(!Array.isArray(l.rows)||!l.rows.length) l.rows=buildDefaultRows(DEFAULT_TEMPLATE_FOR(min),min,slotId);
  l.rows=l.rows.map(r=>({phase:(PH[r.phase]||r.phase==="fixed")?r.phase:"erarbeitung",label:r.label||(PH[r.phase]?PH[r.phase].name:"Phase"),
    min:Number.isFinite(+r.min)?Math.max(0,Math.round(+r.min)):5,
    kern:r.kern||"",impuls:r.impuls||"",sozial:r.sozial||""}));
  if(l.transfer&&(l.transfer.kern||l.transfer.impuls||l.transfer.sozial)){
    l.rows.push({phase:"transfer",label:"Transfer / Ausblick",min:0,kern:l.transfer.kern||"",impuls:l.transfer.impuls||"",sozial:l.transfer.sozial||""});
  }
  delete l.transfer;
  return l;
}
function lessonOf(id){const s=SLOTS.find(x=>x.id===id);S.week[id]=normalize(S.week[id],s.min,id);return S.week[id];}
function hasContent(l){
  if(!l) return false;
  if(l.cancelled) return true;
  if(l.topic||l.goal||l.material||l.exit||l.reserve) return true;
  if(l.comps&&l.comps.length) return true;
  if(l.rows&&l.rows.some(r=>r.kern||r.impuls||r.sozial)) return true;
  if(l.transfer&&(l.transfer.kern||l.transfer.impuls||l.transfer.sozial)) return true;
  return false;
}
const sumMin=l=>(l.rows||[]).reduce((a,r)=>a+(+r.min||0),0);
const filledRows=l=>(l.rows||[]).filter(r=>r.kern||r.impuls||r.sozial).length;
const hasMainAction=l=>(l.rows||[]).some(r=>r.phase==="erarbeitung"&&r.kern&&r.kern.trim());
/* Druckreif: jede einzelne Phase braucht mindestens Inhalt (Themenfeld) UND Sozialform */
const lessonIsComplete=l=>!!(l&&!l.cancelled&&Array.isArray(l.rows)&&l.rows.length
  &&l.rows.every(r=>r.kern&&r.kern.trim()&&r.sozial&&r.sozial.trim()));

function loadCloudConfig(){
  try{
    const raw=localStorage.getItem("edufire:cloud-config");
    if(raw){const c=JSON.parse(raw);S.cloud.url=c.url||"";S.cloud.anonKey=c.anonKey||"";}
  }catch(e){}
}
function saveCloudConfig(){
  localStorage.setItem("edufire:cloud-config",JSON.stringify({url:S.cloud.url,anonKey:S.cloud.anonKey}));
}
function libReady(){return typeof window!=="undefined"&&window.supabase&&typeof window.supabase.createClient==="function";}

function initSupabaseClient(){
  if(!S.cloud.url||!S.cloud.anonKey||!libReady())return null;
  try{
    S.cloud.client=window.supabase.createClient(S.cloud.url,S.cloud.anonKey,
      {auth:{persistSession:true,autoRefreshToken:true}});
    S.cloud.client.auth.onAuthStateChange((event,session)=>{
      onSessionChange(session);
      renderTop();if(S.modal&&S.modal.type==="settings")renderModal();
    });
    return S.cloud.client;
  }catch(e){S.cloud.client=null;return null;}
}

async function bootCloud(){
  loadCloudConfig();
  if(!initSupabaseClient()){S.cloud.status=S.cloud.url?"error":"off";if(!libReady()&&S.cloud.url)S.cloud.error="Supabase-Bibliothek konnte nicht geladen werden (offline?)";return;}
  S.cloud.status="connecting";
  try{
    const{data}=await S.cloud.client.auth.getSession();
    onSessionChange(data&&data.session);
  }catch(e){S.cloud.status="error";S.cloud.error=String(e.message||e);}
}
function onSessionChange(session){
  S.cloud.session=session||null;
  if(session){cloudBackend=makeSupabaseBackend(S.cloud.client,session.user.id);S.cloud.status="signed-in";S.cloud.error="";}
  else{cloudBackend=null;S.cloud.status="signed-out";}
}

async function cloudConnect(url,anonKey){
  S.cloud.url=url.trim().replace(/\/+$/,"");S.cloud.anonKey=anonKey.trim();
  saveCloudConfig();
  if(!initSupabaseClient()){S.cloud.status="error";S.cloud.error="Bitte Projekt-URL und Anon-Key prüfen.";renderModal();return;}
  S.cloud.status="connecting";renderModal();
  try{const{data}=await S.cloud.client.auth.getSession();onSessionChange(data&&data.session);}
  catch(e){S.cloud.status="error";S.cloud.error=String(e.message||e);}
  renderTop();renderModal();
}

  if(!S.cloud.client)return;

  const{error}=await S.cloud.client.auth.signInWithPassword({email,password});

  toast("Angemeldet");
}

  if(!S.cloud.client)return;

  S.todos=S.todos.map(x=>({id:x.id||uid("td"),text:x.text||"",done:!!x.done,course:x.course||"",urgent:!!x.urgent}));
}
const saveTemplates=()=>{clearTimeout(timers.t);timers.t=setTimeout(async()=>{await DB.set("templates",JSON.stringify(S.templates));toast("Gespeichert");},300);};
const saveCustom=()=>{clearTimeout(timers.s);timers.s=setTimeout(async()=>{await DB.set("custom",JSON.stringify(S.custom));toast("Gespeichert");},300);};
const saveTodos=()=>{clearTimeout(timers.td);timers.td=setTimeout(async()=>{await DB.set("todos",JSON.stringify(S.todos));toast("Gespeichert");},300);};
async function loadWeek(){
  S.weekKey=keyFor(S.monday);
  const r=await DB.get(S.weekKey);
  try{S.week=r&&r.value?JSON.parse(r.value):{};}catch(e){S.week={};}
}
function saveWeek(){
  const k=S.weekKey;clearTimeout(timers.w);
  timers.w=setTimeout(async()=>{
    const clean={};Object.keys(S.week).forEach(id=>{if(hasContent(S.week[id]))clean[id]=S.week[id];});
    await DB.set(k,JSON.stringify(clean));toast("Gespeichert");},450);
}
async function allWeeks(){
  const {keys}=await DB.list("week:");const out=[];
  for(const k of (keys||[]).slice().sort()){
    const m=k.match(/week:(\d{4})-W(\d{1,2})/);if(!m)continue;
    const r=await DB.get(k);if(!r||!r.value)continue;
    let d;try{d=JSON.parse(r.value);}catch(e){continue;}
    out.push({key:k,monday:mondayFromISO(+m[1],+m[2]),data:d});
  }
  return out;
}
async function buildOverview(cid){
  const weeks=await allWeeks(),slots=SLOTS.filter(s=>s.course===cid),rows=[];
  weeks.forEach(w=>slots.forEach(s=>{const l=w.data[s.id];
    if(hasContent(l))rows.push({date:addDays(w.monday,s.day-1),slot:s,les:normalize(l,s.min,s.id)});}));
  rows.sort((a,b)=>a.date-b.date);return rows;
}

/* ── Standard-Auswahl (kaskadierende Dropdowns aus dem Rahmenlehrplan) ── */
/* Bevorzugter Rahmenlehrplan je Kurs kommt aus CONFIG (DEFAULT_PLAN) */
function plansFor(course){
  return RLP.filter(p=>p.subject===course.subject && (!p.gradeMin || course.grade>=p.gradeMin));
}
function currentPlan(course){
  const list=plansFor(course);
  const preferred=DEFAULT_PLAN[course.id];
  return list.find(p=>p.id===S.pick.rlp)
    || (preferred&&list.find(p=>p.id===preferred))
    || list[0] || null;
}
/* Einheitliche Item-Liste unabhängig vom Katalog-Format */
/* Relevante Niveaustufen je Kurs kommen aus CONFIG (COURSE_LEVELS) */
function levelParts(lvl){return(lvl||"").split("/").map(s=>s.trim()).filter(Boolean);}
function entryMatchesCourse(lvl,courseId){
  const allowed=COURSE_LEVELS[courseId];
  if(!allowed)return true;
  const parts=levelParts(lvl);
  if(!parts.length)return true;
  return parts.some(p=>allowed.includes(p));
}

function areaItems(area){
  if(!area)return{mode:"subs",items:[]};
  if(area.entries)return{mode:"graduated",items:area.entries.map(e=>({lvl:e[0],col:e[1],text:e[2]}))};
  if(area.standards)return{mode:"standards",items:area.standards.map(s=>({lvl:"",col:"",text:typeof s==="string"?s:s[0]}))};
  return{mode:"subs",items:(area.subs||[]).map(s=>({lvl:"",col:"",text:s}))};
}
let currentPickerItems=[]; // vom zuletzt gerenderten Picker, für den Klick-Handler

function subPickerHtml(items,placeholder,locked){
  currentPickerItems=items;
  const chosenIdx=S.pick.sub?items.findIndex(it=>it.text===S.pick.sub):-1;
  const chosen=chosenIdx>=0?items[chosenIdx]:null;
  if(!items.length){
    return `<div class="subpicker"><input class="subpicker-input" placeholder="Noch keine Standards hinterlegt" disabled></div>`;
  }
  if(chosen&&!S.pick.subOpen){
    return `<div class="subpicker">
      <div class="subchosen">
        <div>${chosen.col||chosen.lvl?`<span class="subchosen-meta">${chosen.col?esc(chosen.col):""}${chosen.col&&chosen.lvl?" · ":""}${chosen.lvl?"<b>"+esc(chosen.lvl)+"</b>":""}</span>`:""}
        <span class="subchosen-text">${esc(chosen.text)}</span></div>
        <button class="btn btn-s" type="button" data-act="sub-reopen" ${locked?'data-gate="lock" disabled':""}>Ändern</button>
      </div>
    </div>`;
  }
  if(!S.pick.subOpen){
    return `<div class="subpicker">
      <input class="subpicker-input" placeholder="${esc(placeholder)}" data-act="sub-reopen" readonly ${locked?'data-gate="lock" disabled':""}>
    </div>`;
  }
  const q=S.pick.subQuery.trim().toLowerCase();
  const filtered=items.map((it,i)=>({...it,_i:i})).filter(it=>!q||(it.text+" "+(it.col||"")+" "+(it.lvl||"")).toLowerCase().includes(q));
  return `<div class="subpicker">
    <input class="subpicker-input" data-act="sub-search" placeholder="${esc(placeholder)}" value="${esc(S.pick.subQuery)}" autocomplete="off" ${locked?'data-gate="lock" disabled':""}>
    <div class="subpicker-list">
      ${filtered.length?filtered.slice(0,250).map(it=>`
        <button class="subpicker-item" type="button" data-act="sub-pick" data-idx="${it._i}">
          ${it.col||it.lvl?`<span class="si-meta">${it.col?esc(it.col):""}${it.col&&it.lvl?" · ":""}${it.lvl?"<b>"+esc(it.lvl)+"</b>":""}</span>`:""}
          <span class="si-text">${esc(it.text)}</span>
        </button>`).join("")
      :`<div class="subpicker-empty">Keine Treffer${q?" für „"+esc(S.pick.subQuery)+"“":""}.</div>`}
    </div>
  </div>`;
}

function compBox(l,course,gated){
  const plans=plansFor(course);
  const own=S.pick.rlp==="own";
  const plan=own?null:currentPlan(course);
  if(!own && plan && !S.pick.rlp) S.pick.rlp=plan.id;
  const areas=plan?plan.areas:[];
  const area=areas.find(a=>((a.c||a.n)===S.pick.area))||null;
  const{mode,items:rawItems}=own
    ?{mode:"own",items:S.custom.filter(x=>x.subject===course.subject||x.subject==="Allgemein").map(x=>({lvl:"",col:"",text:x.text}))}
    :areaItems(area);
  const items=mode==="graduated"?rawItems.filter(it=>entryMatchesCourse(it.lvl,course.id)):rawItems;
  const needsManualLevel=mode==="subs";
  const lock=gated?'data-gate="lock" disabled':"";

  return `<div class="compbox">

/* Verarbeitet alle Adminfelder. isChange=true bei select/color/checkbox/number,
   false beim Tippen — dann wird nicht neu gerendert, damit der Fokus bleibt. */
function applyConfigEdit(el,a,isChange){
  if(!a||!a.startsWith("cfg-"))return false;
  if(!S.admin.unlocked)return false;
  const f=el.getAttribute("data-f");
  const i=+el.getAttribute("data-i");
  let structural=false;

  if(a==="cfg-course"){
    const c=CONFIG.courses[i];if(!c)return true;
    if(f==="levels")c.levels=el.value.split(",").map(s=>s.trim().toUpperCase()).filter(Boolean);
    else if(f==="grade")c.grade=Math.max(1,Math.min(13,+el.value||10));
    else c[f]=el.value;
    structural=(f==="hex"||f==="plan");
  }
  else if(a==="cfg-slot"){
    const s=CONFIG.slots[i];if(!s)return true;
    if(f==="day")s.day=+el.value;
    else if(f==="min")s.min=Math.max(5,Math.min(240,+el.value||45));
    else if(f==="introLabel"){
      const m=(s.intro&&s.intro.min)||10;
      s.intro=el.value.trim()?{label:el.value.trim(),min:m}:null;
    }
    else if(f==="introMin"){
      const n=Math.max(0,Math.min(60,+el.value||0));
      if(s.intro)s.intro=n>0?{...s.intro,min:n}:null;
    }
    else s[f]=el.value;
    structural=(f!=="introLabel");
  }
  else if(a==="cfg-phase"){
    const p=CONFIG.phases[i];if(!p)return true;
    if(f==="hidden")p.hidden=el.checked;else p[f]=el.value;
    structural=(f!=="name");
  }
  else if(a==="cfg-meta"){
    if(f==="weeks")CONFIG.weeks=Math.max(1,Math.min(53,+el.value||40));
    else CONFIG[f]=el.value;
    structural=(f==="fixedHex"||f==="term");
  }
  else if(a==="cfg-methods"){
    CONFIG.methods[f]=el.value.split("\n").map(s=>s.trim()).filter(Boolean);
  }
  else return false;

  saveConfig();
  if(structural&&isChange){renderModal();render();}
  return true;
}

/* Eine Stunde auf genau eine A4-Seite */
function sheetHtml(slot,date,l){
  const c=COURSE[slot.course];
  const sum=sumMin(l),off=sum-slot.min;
  const rows=l.rows.length?l.rows:[{phase:"erarbeitung",label:"Erarbeitung",min:slot.min,kern:"",impuls:"",sozial:""}];

  /* Zeilenhöhe folgt dem Zeitanteil — die Tabelle füllt die Seite, ohne sie zu sprengen */
  const avail=118, tot=Math.max(sum,1);
  const heights=rows.map(r=>Math.max(7,Math.min(34,Math.round(((+r.min||1)/tot)*avail))));
  const shrink=rows.length>9?(rows.length>12?.82:.9):1;

  const scale=Math.max(sum,slot.min)||1;
  const tl=rows.map(r=>`<span style="flex:${Math.max(0,r.min)} 0 0;background:${phHex(r.phase)}">${r.min>=scale*0.09?r.min+"′":""}</span>`).join("")
    +(off<0?`<span style="flex:${-off} 0 0;background:transparent"></span>`:"");
  const ticks=[];for(let t=0;t<=scale;t+=15)ticks.push(t);
  if(ticks[ticks.length-1]!==scale)ticks.push(scale);

  const comps=l.comps.length
    ? l.comps.map(k=>`<b>${esc(k.src||"Standard")}:</b> ${esc(k.text)}`).join("<br>")
    : "<span style='color:#999'>—</span>";

  const trs=rows.map((r,i)=>{
    const clock=rowClock(slot,rows,i);
    return `<tr style="height:${Math.round(heights[i]*shrink)}mm">
      <td class="sh-ph" style="width:28mm"><span class="sh-dot" style="background:${phHex(r.phase)}"></span>${esc(r.label)}<i>ca. ${r.min}′</i>${clock?`<i>${clock} Uhr</i>`:""}</td>
      <td style="width:49mm">${esc(r.kern)}</td>
      <td>${esc(r.impuls)}</td>
      <td style="width:32mm">${esc(r.sozial)}</td>
    </tr>`;}).join("");

  return `<div class="sheet-page"><div class="sheet" style="font-size:${shrink*100}%">
    <div class="sh-top">
      <div class="sh-brand">Edu<em>Fire</em><small>Stundenplanung · Phasierung nach Tilman von Brand</small></div>
      <div class="sh-meta"><b>${esc(c.name)}</b>${dLong(date)}<br>${slot.min} Minuten${slot.start?` · ${slot.start}–${fmtHM(parseHM(slot.start)+slot.min)} Uhr`:""} · geplant ${sum}′${off!==0?` (${off>0?"+":""}${off}′)`:""}</div>
    </div>
    <div class="sh-fields">
      <div class="sh-f"><span>Thema der Stunde</span><div>${esc(l.topic)||"&nbsp;"}</div></div>
      <div class="sh-f"><span>Stundenziel — die S. können …</span><div>${esc(l.goal)||"&nbsp;"}</div></div>
      <div class="sh-f wide"><span>Kompetenzstandard</span><div>${comps}</div></div>
      ${l.material?`<div class="sh-f wide"><span>🎒 Material zum Mitbringen</span><div>${esc(l.material)}</div></div>`:""}
    </div>
    <div class="sh-tlwrap">
      <div class="sh-tl">${tl}</div>
      <div class="sh-ticks">${ticks.map(t=>`<span>${t}</span>`).join("")}</div>
    </div>
    <table class="sh-tbl"><thead><tr>
      <th>Zeit · Phase</th><th>Inhalt – fachlicher Kern</th><th>Impuls / Aufgabenstellung</th><th>Sozialform · Material</th>
    </tr></thead><tbody>${trs}</tbody></table>
    <div class="sh-bottom">
      <div class="sh-b exit"><span>Notausstieg — wenn die Zeit nicht reicht</span><div>${esc(l.exit)||"&nbsp;"}</div></div>
      <div class="sh-b res"><span>Reserve — wenn Zeit übrig bleibt</span><div>${esc(l.reserve)||"&nbsp;"}</div></div>
    </div>
    <div class="sh-foot">
      <span>EA · PA · GA · UG · LV · Plenum &nbsp;|&nbsp; AFB I zusammenfassen, beschreiben, darstellen, einordnen · AFB II analysieren, charakterisieren, erläutern, vergleichen · AFB III interpretieren, erörtern, beurteilen, überprüfen</span>
      <span>${new Date().toLocaleDateString("de-DE")}</span>
    </div>
  </div></div>`;
}

function buildLessonSheet(slotId,date){
  const slot=SLOTS.find(s=>s.id===slotId),l=lessonOf(slotId);
  document.getElementById("printout").innerHTML=sheetHtml(slot,date,l);
}

/* Nur vollständig geplante Stunden gelten als „fertig“ und werden gedruckt:
   jede Phase braucht mindestens Inhalt (Themenfeld) und Sozialform. */
function isLessonReady(slotId){
  return lessonIsComplete(S.week[slotId]);
}
function isLessonCancelled(slotId){
  const raw=S.week[slotId];
  return !!(raw&&raw.cancelled);
}
function dayLessons(day){
  return SLOTS.filter(s=>s.day===day).map(slot=>({slot,date:addDays(S.monday,slot.day-1)}));
}
function weekLessons(){
  return SLOTS.map(slot=>({slot,date:addDays(S.monday,slot.day-1)}));
}
function buildMultiSheet(items,label){
  const cancelled=items.filter(({slot})=>isLessonCancelled(slot.id));
  const candidates=items.filter(({slot})=>!isLessonCancelled(slot.id));
  const ready=candidates.filter(({slot})=>isLessonReady(slot.id));
  if(!ready.length){
    toast("Für "+label+" ist noch keine Stunde fertig geplant");
    return false;
  }
  const html=ready.map(({slot,date})=>sheetHtml(slot,date,lessonOf(slot.id))).join("");
  document.getElementById("printout").innerHTML=html;
  const notReady=candidates.length-ready.length;
  const parts=[];
  if(notReady>0)parts.push(notReady+" noch nicht fertig");
  if(cancelled.length>0)parts.push(cancelled.length+" fällt/fallen aus");
  if(parts.length)toast(parts.join(" · ")+" — übersprungen");
  return true;
}

function buildPrint(){
  const c=COURSE[S.overviewCourse];
  const rows=S.overviewRows.filter(r=>r.les.cancelled||lessonIsComplete(r.les));
  const skipped=S.overviewRows.length-rows.length;
  const trs=rows.map(r=>{
    if(r.les.cancelled){
      return `<tr><td><b>${DAYNAME[r.slot.day]}</b><br>${dShort(r.date)}.${r.date.getFullYear()}</td>
        <td colspan="4" style="color:#888">⊘ Fällt aus${r.les.reason?" — "+esc(r.les.reason):""}</td></tr>`;
    }
    const verlauf=r.les.rows.map(x=>{
      if(!x.kern&&!x.impuls&&!x.sozial)return "";
      return `<div class="pline"><span class="pph" style="background:${phHex(x.phase)}">${esc(x.label)} ${x.min}′</span>${[x.kern,x.impuls,x.sozial].filter(Boolean).map(esc).join(" — ")}</div>`;
    }).join("");
    const comps=r.les.comps.map(k=>`${esc(k.src||"")}: ${esc(k.text)}`).join("<br>");
    const fb=[r.les.exit?"Notausstieg: "+esc(r.les.exit):"",r.les.reserve?"Reserve: "+esc(r.les.reserve):""].filter(Boolean).join("<br>");
    const sum=sumMin(r.les);
    return `<tr><td><b>${DAYNAME[r.slot.day]}</b><br>${dShort(r.date)}.${r.date.getFullYear()}<br>${sum}/${r.slot.min}′</td>
      <td><b>${esc(r.les.topic)||"—"}</b>${r.les.goal?"<br>"+esc(r.les.goal):""}</td>
      <td>${verlauf||"—"}</td><td>${comps||"—"}</td><td>${fb}</td></tr>`;}).join("");
  document.getElementById("printout").innerHTML=`
    <div class="ptitle">EduFire — Planungsübersicht ${esc(c.name)}</div>
    <div class="psub">${esc(c.subject)} · Stand ${new Date().toLocaleDateString("de-DE")} · Phasierung nach Tilman von Brand</div>
    <table class="pt"><thead><tr>
      <th style="width:9%">Termin</th><th style="width:17%">Thema / Ziel</th><th style="width:42%">Phasenverlauf</th>
      <th style="width:19%">Kompetenzstandard</th><th style="width:13%">Notausstieg / Reserve</th></tr></thead>
      <tbody>${trs||'<tr><td colspan="5">Noch keine fertig geplanten Stunden.</td></tr>'}</tbody></table>`;
  if(skipped>0)toast(skipped+" noch nicht fertig geplante Stunde"+(skipped>1?"n":"")+" — übersprungen");
}

/* ══ 10 · SICHERUNG ══ */
async function exportBackup(){
  const weeks=await allWeeks();
  const payload={app:"EduFire",version:2,exported:new Date().toISOString(),
    templates:S.templates,custom:S.custom,todos:S.todos,weeks:Object.fromEntries(weeks.map(w=>[w.key,w.data]))};
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}));
  a.download="edufire-sicherung-"+toISO(new Date())+".json";
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
  toast("Sicherung heruntergeladen");
}
async function importBackup(file){
  try{
    const d=JSON.parse(await file.text());
    if(!d||(d.app!=="EduFire"&&d.app!=="FireFlEyes")){toast("Keine EduFire-Sicherung");return;}
    if(Array.isArray(d.templates)){S.templates=d.templates;await DB.set("templates",JSON.stringify(S.templates));}
    if(Array.isArray(d.custom)){S.custom=d.custom;await DB.set("custom",JSON.stringify(S.custom));}
    else if(Array.isArray(d.competencies)){
      S.custom=d.competencies.map(x=>({id:x.id||uid("s"),text:(x.code?x.code+" — ":"")+x.text,subject:x.subject||"Allgemein"}));
      await DB.set("custom",JSON.stringify(S.custom));}
    if(Array.isArray(d.todos)){S.todos=d.todos;await DB.set("todos",JSON.stringify(S.todos));}
    if(d.weeks&&typeof d.weeks==="object")
      for(const [k,v] of Object.entries(d.weeks)) if(/^week:\d{4}-W\d{1,2}$/.test(k)) await DB.set(k,JSON.stringify(v));
    await loadWeek();
    if(S.view==="course")S.overviewRows=await buildOverview(S.overviewCourse);
    S.modal=null;render();toast("Sicherung eingelesen");
  }catch(e){toast("Datei konnte nicht gelesen werden");}
}

/* ══ 11 · EVENTS ══ */
function closeModal(){S.modal=null;renderModal();render();}

document.addEventListener("click",async(e)=>{
  if(e.target.classList&&e.target.classList.contains("scrim")){closeModal();return;}
  const el=e.target.closest("[data-act]");
  if(!el){
    if(S.datepop&&!e.target.closest("#datepop")){S.datepop=false;renderTop();}
    if(S.pick.subOpen&&!e.target.closest(".subpicker")){S.pick.subOpen=false;renderModal();}
    return;
  }
  const a=el.getAttribute("data-act");
  const L=()=>lessonOf(S.modal.slotId);
  const SLOT=()=>SLOTS.find(s=>s.id===S.modal.slotId);

  switch(a){
    case "view": S.view=el.getAttribute("data-view");
      if(S.view==="course")S.overviewRows=await buildOverview(S.overviewCourse);
      render();break;
    case "week-prev": S.monday=addDays(S.monday,-7);await loadWeek();render();break;
    case "week-next": S.monday=addDays(S.monday,7);await loadWeek();render();break;
    case "week-today":S.monday=mondayOf(new Date());await loadWeek();render();break;
    case "datepop": S.datepop=!S.datepop;renderTop();break;

    case "open-lesson":{
      const id=el.getAttribute("data-slot"),slot=SLOTS.find(s=>s.id===id);
      lessonOf(id);
      S.pick={rlp:"",area:"",sub:"",level:"",text:"",subQuery:"",subOpen:false};
      S.modal={type:"lesson",slotId:id,date:addDays(S.monday,slot.day-1)};
      renderModal();break;}
    case "close": closeModal();break;
    case "finish-lesson": closeModal();break;
    case "jump-erarbeitung":{
      const target=document.querySelector('[data-mainaction="true"]');
      if(target){target.scrollIntoView({block:"center",behavior:"smooth"});target.focus();}
      break;}
    case "jump-standard":{
      const box=document.querySelector(".compbox");
      if(box)box.scrollIntoView({block:"center",behavior:"smooth"});
      const inp=document.querySelector(".compbox .subpicker-input:not(:disabled)");
      if(inp)inp.focus();
      break;}

    /* Phasen-Editor */
    case "row-add":{const l=L();
      l.rows.push({phase:"erarbeitung",label:"Neue Phase",min:5,kern:"",impuls:"",sozial:""});
      saveWeek();renderModal();break;}
    case "row-del":{const l=L();l.rows.splice(+el.getAttribute("data-i"),1);saveWeek();renderModal();break;}
    case "row-up":{const l=L(),i=+el.getAttribute("data-i");
      if(i>0){[l.rows[i-1],l.rows[i]]=[l.rows[i],l.rows[i-1]];saveWeek();renderModal();}break;}
    case "row-down":{const l=L(),i=+el.getAttribute("data-i");
      if(i<l.rows.length-1){[l.rows[i+1],l.rows[i]]=[l.rows[i],l.rows[i+1]];saveWeek();renderModal();}break;}
    case "fit":{const l=L(),slot=SLOT(),sum=sumMin(l);
      if(sum>0&&l.rows.length){
        l.rows.forEach(r=>{r.min=Math.max(1,Math.round(r.min*slot.min/sum));});
        let diff=slot.min-sumMin(l);
        while(diff!==0){let idx=0;l.rows.forEach((r,i)=>{if(r.min>l.rows[idx].min)idx=i;});
          l.rows[idx].min+=diff>0?1:-1;diff+=diff>0?-1:1;if(l.rows[idx].min<1)break;}
      }
      saveWeek();renderModal();toast("Auf "+slot.min+" Minuten angepasst");break;}
    case "save-tpl":{const l=L();
      const name=prompt("Name der Vorlage:", l.topic?("Vorlage: "+l.topic):"Eigene Vorlage");
      if(!name)break;
      const g=(function(){const m=l.rows.map(r=>r.min),mn=Math.min(...m.filter(x=>x>0))||1;return mn;})();
      S.templates.push({id:uid("tpl"),name:name.trim(),
        units:l.rows.map(r=>[r.phase,r.label,Math.max(1,Math.round(r.min/g))])});
      saveTemplates();toast("Vorlage gesichert");renderModal();break;}
    case "clear-lesson":{const id=S.modal.slotId,slot=SLOTS.find(s=>s.id===id),back=S.modal;
      S.modal={type:"confirm",title:"Stunde leeren?",body:"Alle Eingaben dieser Stunde werden entfernt.",okLabel:"Leeren",
        onYes:()=>{S.week[id]=blankLesson(slot.min,id);saveWeek();S.modal=back;renderModal();}};
      renderModal();break;}
    case "toggle-cancel":{
      const l=L();l.cancelled=!l.cancelled;saveWeek();renderModal();renderWeekGrid();break;}
    case "confirm-yes":{const f=S.modal&&S.modal.onYes;if(f)f();else closeModal();break;}

    /* Standards */
    case "comp-add":{
      const l=L(),c=COURSE[SLOT().course];
      let src="",text="";
      if(S.pick.rlp==="own"){
        if(!S.pick.sub){toast("Bitte einen eigenen Standard wählen");break;}
        src="Eigener Standard";text=S.pick.sub;
      }else{
        const plan=currentPlan(c);
        if(!plan){toast("Kein Rahmenlehrplan verfügbar");break;}
        const area=plan.areas.find(x=>(x.c||x.n)===S.pick.area);
        if(!area){toast("Bitte einen Kompetenzbereich wählen");break;}
        if(!S.pick.sub){toast("Bitte einen Standard wählen");break;}
        const{mode,items}=areaItems(area);
        const chosen=items.find(it=>it.text===S.pick.sub);
        src=[plan.name.replace(/ \(Teil C\)$/,""),(area.c?area.c+" ":"")+area.n].join(" · ");
        if(mode==="graduated"&&chosen){src+=" · "+(chosen.col?chosen.col+" · ":"")+"Niveaustufe "+chosen.lvl;}
        else if(mode==="standards"&&chosen){src+=" · "+chosen.lvl;}
        else if(mode==="subs"&&S.pick.level){src+=" · Niveaustufe "+S.pick.level;}
        text=mode==="subs"?(S.pick.text.trim()?S.pick.sub+" — "+S.pick.text.trim():S.pick.sub):S.pick.sub;
      }
      l.comps.push({id:uid("k"),src,text});
      S.pick.sub="";S.pick.text="";S.pick.level="";S.pick.subQuery="";S.pick.subOpen=false;
      saveWeek();renderModal();break;}
    case "comp-del":{const l=L();l.comps=l.comps.filter(x=>x.id!==el.getAttribute("data-id"));saveWeek();renderModal();break;}

    case "sub-reopen": S.pick.subOpen=true;S.pick.subQuery="";renderModal();
      {const inp=document.querySelector(".subpicker-input");if(inp)inp.focus();}break;
    case "sub-pick":{
      const it=currentPickerItems[+el.getAttribute("data-idx")];
      if(it){S.pick.sub=it.text;S.pick.subOpen=false;S.pick.subQuery="";}
      renderModal();break;}

    /* Einstellungen */
    case "open-eye": S.modal={type:"eye"};renderModal();break;

    /* ── versteckter Adminmodus ── */
    case "brand-tap":{
      const now=Date.now();
      if(!brandTaps.t||now-brandTaps.t>2000)brandTaps.n=0;
      brandTaps.t=now;brandTaps.n++;
      if(brandTaps.n>=5){
        brandTaps.n=0;
        S.admin.error="";S.admin.busy=false;
        S.modal={type:"admin"};renderModal();
        setTimeout(()=>{const f=document.getElementById("admMail")||document.getElementById("admPw");if(f)f.focus();},50);
      }
      break;}
    case "admin-tab": S.admin.tab=el.getAttribute("data-t");renderModal();break;
    case "admin-lock": S.admin.unlocked=false;S.admin.error="";renderModal();break;
    case "admin-login":{
      const email=(document.getElementById("admMail")||{}).value||"";
      const pw=(document.getElementById("admPw")||{}).value||"";
      if(!email.trim()||!pw){S.admin.error="Bitte E-Mail und Passwort eingeben.";renderModal();break;}
      S.admin.busy=true;S.admin.error="";renderModal();
      const{error}=await S.cloud.client.auth.signInWithPassword({email:email.trim(),password:pw});
      S.admin.busy=false;
      if(error){S.admin.error=error.message;renderModal();break;}
      S.admin.unlocked=true;S.admin.tab="courses";
      await loadConfig();await loadGlobals();await loadWeek();
      render();toast("Adminmodus aktiv");break;}
    case "admin-verify":{
      const pw=(document.getElementById("admPw")||{}).value||"";
      const email=(S.cloud.session&&S.cloud.session.user.email)||"";
      if(!pw){S.admin.error="Bitte Passwort eingeben.";renderModal();break;}
      S.admin.busy=true;S.admin.error="";renderModal();
      const{error}=await S.cloud.client.auth.signInWithPassword({email,password:pw});
      S.admin.busy=false;
      if(error){S.admin.error="Passwort stimmt nicht.";renderModal();break;}
      S.admin.unlocked=true;S.admin.tab="courses";renderModal();toast("Adminmodus aktiv");break;}

    /* ── Kurse ── */
    case "cfg-course-add":
      CONFIG.courses.push({id:uid("c"),name:"Neuer Kurs",subject:"Deutsch",grade:10,
        hex:PALETTE[CONFIG.courses.length%PALETTE.length],levels:[],plan:""});
      saveConfig();renderModal();break;
    case "cfg-course-move":{
      const i=+el.getAttribute("data-i"),d=+el.getAttribute("data-dir"),a=CONFIG.courses;
      if(a[i+d]){[a[i],a[i+d]]=[a[i+d],a[i]];saveConfig();renderModal();render();}
      break;}
    case "cfg-course-del":{
      const i=+el.getAttribute("data-i"),c=CONFIG.courses[i];
      const used=CONFIG.slots.filter(s=>s.course===c.id).length;
      const back=S.modal;
      S.modal={type:"confirm",title:"Kurs löschen?",okLabel:"Löschen",
        body:`„${c.name}“ wird entfernt${used?" — dazu auch "+used+" Unterrichtsstunde(n) im Stundenplan":""}. Bereits geplante Inhalte bleiben gespeichert, werden aber nicht mehr angezeigt.`,
        onYes:()=>{CONFIG.courses.splice(i,1);CONFIG.slots=CONFIG.slots.filter(s=>s.course!==c.id);
          saveConfig();S.modal=back;renderModal();render();}};
      renderModal();break;}

    /* ── Stundenplan ── */
    case "cfg-slot-add":{
      const first=CONFIG.courses[0];
      if(!first){toast("Bitte zuerst einen Kurs anlegen");break;}
      CONFIG.slots.push({id:uid("s"),day:1,course:first.id,min:45,start:"08:00",intro:null});
      saveConfig();renderModal();render();break;}
    case "cfg-slot-move":{
      const i=+el.getAttribute("data-i"),d=+el.getAttribute("data-dir"),a=CONFIG.slots;
      if(a[i+d]){[a[i],a[i+d]]=[a[i+d],a[i]];saveConfig();renderModal();render();}
      break;}
    case "cfg-slot-del":{
      CONFIG.slots.splice(+el.getAttribute("data-i"),1);saveConfig();renderModal();render();break;}
    case "cfg-holiday-add":{
      const v=(document.getElementById("holInput")||{}).value;
      if(!v){toast("Bitte ein Datum wählen");break;}
      const i=isoWeek(mondayOf(new Date(v+"T00:00:00")));
      const key=i.year+"-W"+String(i.week).padStart(2,"0");
      CONFIG.holidays=CONFIG.holidays||[];
      if(!CONFIG.holidays.includes(key)){CONFIG.holidays.push(key);CONFIG.holidays.sort();}
      saveConfig();renderModal();render();break;}
    case "cfg-holiday-del":
      CONFIG.holidays=(CONFIG.holidays||[]).filter(k=>k!==el.getAttribute("data-k"));
      saveConfig();renderModal();render();break;

    /* ── Phasen ── */
    case "cfg-phase-add":
      CONFIG.phases.push({id:uid("p"),name:"Neue Phase",hex:"#64748B",hidden:false});
      saveConfig();renderModal();break;
    case "cfg-phase-move":{
      const i=+el.getAttribute("data-i"),d=+el.getAttribute("data-dir"),a=CONFIG.phases;
      if(a[i+d]){[a[i],a[i+d]]=[a[i+d],a[i]];saveConfig();renderModal();}
      break;}
    case "cfg-phase-del":{
      const i=+el.getAttribute("data-i"),p=CONFIG.phases[i],back=S.modal;
      S.modal={type:"confirm",title:"Phase löschen?",okLabel:"Löschen",
        body:`„${p.name}“ wird entfernt. In bereits geplanten Stunden wird sie beim nächsten Öffnen zu „Erarbeitung“. Zum Erhalten stattdessen „ausblenden“ verwenden.`,
        onYes:()=>{CONFIG.phases.splice(i,1);saveConfig();S.modal=back;renderModal();render();}};
      renderModal();break;}

    case "open-settings": S.modal={type:"settings"};renderModal();break;
    case "open-todos": S.modal={type:"todos"};renderModal();
      {const inp=document.getElementById("todoInput");if(inp)inp.focus();}break;
    case "todo-add":{
      const inp=document.getElementById("todoInput");
      const courseSel=document.getElementById("todoCourseInput");
      const text=inp?inp.value.trim():"";
      if(!text){if(inp)inp.focus();break;}
      S.todos.push({id:uid("td"),text,done:false,course:courseSel?courseSel.value:"",urgent:false});
      saveTodos();renderModal();renderTop();
      {const inp2=document.getElementById("todoInput");if(inp2)inp2.focus();}
      break;}
    case "todo-toggle":{
      const t=S.todos.find(x=>x.id===el.getAttribute("data-id"));
      if(t){t.done=!t.done;saveTodos();renderModal();renderTop();}
      break;}
    case "todo-urgent":{
      const t=S.todos.find(x=>x.id===el.getAttribute("data-id"));
      if(t){t.urgent=!t.urgent;saveTodos();renderModal();}
      break;}
    case "todo-del":{
      S.todos=S.todos.filter(x=>x.id!==el.getAttribute("data-id"));
      saveTodos();renderModal();renderTop();break;}
    case "todo-clear-done":{
      S.todos=S.todos.filter(x=>!x.done);
      saveTodos();renderModal();renderTop();break;}
    case "stab": S.settingsTab=el.getAttribute("data-t");renderModal();break;
    case "tpl-del":{const id=el.getAttribute("data-id");
      S.templates=S.templates.filter(t=>t.id!==id);saveTemplates();renderModal();break;}
    case "std-add":{
      const text=document.getElementById("nText").value.trim();
      const subject=document.getElementById("nSubj").value;
      if(!text){toast("Bitte einen Wortlaut eingeben");break;}
      S.custom.push({id:uid("s"),text,subject});saveCustom();renderModal();break;}
    case "std-bulk":{
      const raw=document.getElementById("nBulk").value;let n=0;
      raw.split("\n").map(x=>x.trim()).filter(Boolean).forEach(line=>{
        const p=line.split("|").map(x=>x.trim());
        const s=(p[1]||"").toLowerCase();
        const subject=s.startsWith("ges")?"Geschichte":s.startsWith("all")?"Allgemein":"Deutsch";
        if(p[0]){S.custom.push({id:uid("s"),text:p[0],subject});n++;}});
      if(n){saveCustom();toast(n+" Standards importiert");}else toast("Keine gültigen Zeilen");
      renderModal();break;}
    case "std-del":{const id=el.getAttribute("data-id");
      S.custom=S.custom.filter(x=>x.id!==id);saveCustom();renderModal();break;}

    case "pick-course": S.overviewCourse=el.getAttribute("data-course");
      S.overviewRows=await buildOverview(S.overviewCourse);render();break;
    case "jump":{const r=S.overviewRows[+el.getAttribute("data-idx")];if(!r)break;
      S.monday=mondayOf(r.date);await loadWeek();S.view="week";
      lessonOf(r.slot.id);S.pick={rlp:"",area:"",sub:"",level:"",text:"",subQuery:"",subOpen:false};
      S.modal={type:"lesson",slotId:r.slot.id,date:r.date};render();break;}

    case "print-lesson":{
      const id=S.modal.slotId,d=S.modal.date;
      if(!lessonIsComplete(S.week[id])){toast("Jede Phase braucht Inhalt und Sozialform, um zu drucken");break;}
      buildLessonSheet(id,d);setPage("portrait");
      setTimeout(()=>window.print(),140);break;}
    case "print-day":{
      const day=+el.getAttribute("data-day");
      const ok=buildMultiSheet(dayLessons(day),DAYNAME[day]);
      if(ok){setPage("portrait");setTimeout(()=>window.print(),140);}
      break;}
    case "print-week":{
      const ok=buildMultiSheet(weekLessons(),"diese Woche");
      if(ok){setPage("portrait");setTimeout(()=>window.print(),140);}
      break;}
    case "print": buildPrint();setPage("landscape");setTimeout(()=>window.print(),140);break;
    case "export": exportBackup();break;
    case "import-click": document.getElementById("importFile").click();break;

    case "cloud-connect":{
      const url=document.getElementById("cfgUrl").value;
      const key=document.getElementById("cfgKey").value;
      if(!url.trim()||!key.trim()){toast("Bitte URL und Key eintragen");break;}
      await cloudConnect(url,key);break;}
    case "cloud-signin":{
      const email=document.getElementById("authEmail").value.trim();
      const pw=document.getElementById("authPassword").value;
      if(!email||!pw){toast("E-Mail und Passwort eingeben");break;}
      await cloudSignIn(email,pw);break;}
    case "cloud-signup":{
      const email=document.getElementById("authEmail").value.trim();
      const pw=document.getElementById("authPassword").value;
      if(!email||pw.length<6){toast("E-Mail und Passwort (min. 6 Zeichen) eingeben");break;}
      await cloudSignUp(email,pw);break;}
    case "cloud-signout": await cloudSignOut();break;
    case "cloud-migrate": await migrateLocalToCloud();renderModal();break;
    case "cloud-copy-sql":{
      try{await navigator.clipboard.writeText(CLOUD_SQL);toast("SQL kopiert");}
      catch(e){
        const box=document.getElementById("sqlBox");
        if(box){const r=document.createRange();r.selectNodeContents(box);
          const sel=window.getSelection();sel.removeAllRanges();sel.addRange(r);
          toast("Bitte manuell kopieren (markiert)");}
      }break;}
  }
});

/* Tippen: direkt in den State, ohne Neuaufbau (Fokus bleibt erhalten) */
document.addEventListener("input",(e)=>{
  const el=e.target,a=el.getAttribute&&el.getAttribute("data-act");
  if(applyConfigEdit(el,a,false))return;
  if(!a||!S.modal||S.modal.type!=="lesson")return;
  const l=lessonOf(S.modal.slotId);
  if(a==="head"){l[el.getAttribute("data-f")]=el.value;saveWeek();return;}
  if(a==="row"){
    const r=l.rows[+el.getAttribute("data-i")];r[el.getAttribute("data-f")]=el.value;saveWeek();
    const box=el.closest(".phaserow");
    if(box)box.setAttribute("data-filled",String(!!(r.kern||r.impuls||r.sozial)));
    if(el.getAttribute("data-f")==="kern"&&r.phase==="erarbeitung"){
      applyGateState(hasMainAction(l));
    }
    if(el.getAttribute("data-f")==="kern"||el.getAttribute("data-f")==="sozial"){
      applyPrintReadyState(l);
    }
    return;}
  if(a==="pick"&&el.getAttribute("data-f")==="text"){S.pick.text=el.value;return;}
  if(a==="sub-search"){
    S.pick.subQuery=el.value;S.pick.subOpen=true;
    renderModal();
    const inp=document.querySelector(".subpicker-input");
    if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);}
    return;}
});

document.addEventListener("change",async(e)=>{
  const el=e.target,a=el.getAttribute&&el.getAttribute("data-act");
  if(el.id==="dpInput"&&el.value){S.monday=mondayOf(new Date(el.value+"T00:00:00"));S.datepop=false;await loadWeek();render();return;}
  if(el.id==="importFile"&&el.files&&el.files[0]){importBackup(el.files[0]);el.value="";return;}
  if(applyConfigEdit(el,a,true))return;
  if(a==="todo-course"){
    const t=S.todos.find(x=>x.id===el.getAttribute("data-id"));
    if(t){t.course=el.value;saveTodos();renderModal();}
    return;
  }
  if(!a||!S.modal)return;
  if(a==="row-min"){
    const l=lessonOf(S.modal.slotId),r=l.rows[+el.getAttribute("data-i")];
    r.min=Math.max(0,Math.min(240,Math.round(+el.value||0)));
    saveWeek();renderModal();return;}
  if(a==="row-phase"){
    const l=lessonOf(S.modal.slotId),i=+el.getAttribute("data-i"),r=l.rows[i];
    const oldName=PH[r.phase]?PH[r.phase].name:"";
    r.phase=el.value;
    if(!r.label||r.label===oldName||r.label==="Neue Phase")r.label=PH[r.phase].name;
    saveWeek();renderModal();return;}
  if(a==="apply-tpl"&&el.value){
    const l=lessonOf(S.modal.slotId),slot=SLOTS.find(s=>s.id===S.modal.slotId),tp=templateById(el.value);
    if(!tp)return;
    const keep=l.rows.some(r=>r.kern||r.impuls||r.sozial);
    const back=S.modal;
    const apply=()=>{const fresh=templateToRows(tp,slot.min);
      fresh.forEach((r,i)=>{const o=l.rows[i];if(o){r.kern=o.kern;r.impuls=o.impuls;r.sozial=o.sozial;}});
      l.rows=fresh;l.tpl=tp.id;saveWeek();S.modal=back;renderModal();toast("Vorlage übernommen");};
    if(keep){S.modal={type:"confirm",title:"Vorlage übernehmen?",okLabel:"Übernehmen",
        body:"Phasen und Zeiten werden ersetzt. Bereits eingetragene Inhalte werden der Reihe nach übertragen, überzählige Zeilen gehen verloren.",onYes:apply};
      renderModal();}else apply();
    return;}
  if(a==="pick"){
    const f=el.getAttribute("data-f");
    if(f==="rlp"){S.pick.rlp=el.value;S.pick.area="";S.pick.sub="";S.pick.level="";S.pick.text="";S.pick.subQuery="";S.pick.subOpen=false;}
    else if(f==="area"){S.pick.area=el.value;S.pick.sub="";S.pick.level="";S.pick.text="";S.pick.subQuery="";S.pick.subOpen=false;}
    else S.pick[f]=el.value;
    renderModal();return;}
});

document.addEventListener("keydown",(e)=>{
  if(e.key==="Escape"){
    if(S.datepop){S.datepop=false;renderTop();return;}
    if(S.modal){closeModal();return;}
  }
  if(e.ctrlKey&&e.shiftKey&&(e.key==="A"||e.key==="a")){
    e.preventDefault();
    S.admin.error="";S.admin.busy=false;
    S.modal={type:"admin"};renderModal();
    setTimeout(()=>{const f=document.getElementById("admMail")||document.getElementById("admPw");if(f)f.focus();},50);
    return;
  }
  if(e.key==="Enter"&&e.target&&e.target.id==="todoInput"){
    e.preventDefault();
    const text=e.target.value.trim();
    const courseSel=document.getElementById("todoCourseInput");
    if(text){S.todos.push({id:uid("td"),text,done:false,course:courseSel?courseSel.value:"",urgent:false});saveTodos();renderModal();renderTop();
      const inp=document.getElementById("todoInput");if(inp)inp.focus();}
    return;
  }
  if(S.modal||S.view!=="week")return;
  if(e.target.matches("input,textarea,select"))return;
  if(e.key==="ArrowLeft"){S.monday=addDays(S.monday,-7);loadWeek().then(render);}
  if(e.key==="ArrowRight"){S.monday=addDays(S.monday,7);loadWeek().then(render);}
});

function refreshDatalists(){
  const mk=(id,arr)=>{
    let d=document.getElementById(id);
    if(!d){d=document.createElement("datalist");d.id=id;document.body.appendChild(d);}
    d.innerHTML=(arr||[]).map(o=>`<option value="${esc(o)}">`).join("");
  };
  mk("dl-ein",SUGGEST.einstieg);mk("dl-erg",SUGGEST.ergebnissicherung);mk("dl-soz",SUGGEST.sozial);
}

(async function(){
  await bootCloud();
  await loadConfig();
  await loadGlobals();
  await loadWeek();
  render();
})();
